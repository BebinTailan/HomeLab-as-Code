[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homelab"
version = "0.1.0.dev0"
description = "Describe a lab network once and generate its documentation, router, firewall and VPN configs."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Tailan Bebin" }]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: System :: Networking",
]

[project.scripts]
homelab = "homelab.cli:main"

[tool.setuptools.packages.find]
include = ["homelab*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
